name: Gold level alerts

# RETIRED - superseded by the Cloudflare Worker (gold-alerts.shabihassan951.workers.dev),
# which runs every minute and therefore also handles 3m candles. The schedule below
# is commented out so this no longer fires on its own; it can still be run by hand
# from the Actions tab, and re-enabled by uncommenting the two cron lines.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      test_notify:
        description: "Send a test notification instead of checking levels"
        type: boolean
        default: false

concurrency:
  group: gold-alerts            # never let two runs overlap and double-fire
  cancel-in-progress: false

permissions:
  contents: write               # needed to commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check levels
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
          TWELVEDATA_KEY:   ${{ secrets.TWELVEDATA_KEY }}
          TEST_NOTIFY:      ${{ github.event.inputs.test_notify }}
        run: |
          echo "test_notify input = '$TEST_NOTIFY'"
          if [ "$TEST_NOTIFY" = "true" ]; then
            echo "--> running in TEST NOTIFICATION mode"
            python check_levels.py --test-notify
          else
            echo "--> running normal level check"
            python check_levels.py
          fi

      - name: Persist fired levels
        run: |
          if ! git diff --quiet state.json; then
            git config user.name  "gold-alerts-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "chore: level fired [skip ci]"
            git push
          else
            echo "no state change"
          fi
