# Registers the Telegram webhook so the bot's /add, /list, /del commands reach
# your Cloudflare Worker. Run from the Actions tab.
#
# This exists because api.telegram.org is blocked on the author's ISP, so the
# usual one-line curl cannot be run locally. GitHub's runners can reach it.
name: Register Telegram webhook

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Worker URL, e.g. https://gold-alerts.yourname.workers.dev"
        required: true
      action:
        description: "set or delete or info"
        type: choice
        options: [set, info, delete]
        default: set

jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Call Telegram setWebhook
        env:
          TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
          URL:    ${{ inputs.worker_url }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot$TOKEN"
          case "$ACTION" in
            set)
              if [ -z "${SECRET:-}" ]; then
                echo "::error::WEBHOOK_SECRET repo secret is not set"; exit 1
              fi
              # Telegram only accepts A-Z a-z 0-9 _ - in secret_token, and a
              # pasted secret often carries a trailing newline. Trim, then check.
              SECRET=$(printf '%s' "$SECRET" | tr -d '[:space:]')
              if ! printf '%s' "$SECRET" | grep -qE '^[A-Za-z0-9_-]{1,256}$'; then
                bad=$(printf '%s' "$SECRET" | tr -d 'A-Za-z0-9_-')
                {
                  echo "## Webhook secret rejected"
                  echo "Telegram allows only \`A-Z a-z 0-9 _ -\` in the secret token."
                  echo ""
                  echo "- length after trimming: ${#SECRET}"
                  echo "- disallowed characters present: \`$(printf '%s' "$bad" | head -c 40)\`"
                  echo ""
                  echo "Pick a plain value like \`gold7x9k2mq4pz\` and set it in **both**"
                  echo "places: \`npx wrangler secret put WEBHOOK_SECRET\` and this repo's"
                  echo "\`WEBHOOK_SECRET\` secret. They must match exactly."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error::WEBHOOK_SECRET contains characters Telegram does not allow"
                exit 1
              fi
              resp=$(curl -sS -X POST "$api/setWebhook" \
                -H 'Content-Type: application/json' \
                -d "{\"url\":\"$URL\",\"secret_token\":\"$SECRET\",\"allowed_updates\":[\"message\"]}")
              ;;
            delete) resp=$(curl -sS "$api/deleteWebhook") ;;
            info)   resp=$(curl -sS "$api/getWebhookInfo") ;;
          esac
          echo "$resp"
          {
            echo "## Telegram webhook — \`$ACTION\`"
            echo '```json'
            echo "$resp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$resp" | grep -q '"ok":true' || { echo "::error::Telegram rejected the call"; exit 1; }
