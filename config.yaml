# Levels to watch.  NO SECRETS IN THIS FILE - this repo is public.
# Telegram token / chat id live in GitHub repo Secrets.
#
#   timeframe : 3m | 15m | 1h | 4h | 1d      (3m is unreliable on GitHub's 5-min cron)
#   direction : above | below | both
#
# Each level fires ONCE then disables itself (recorded in state.json).
# Re-arm by changing its price or label, then commit.

levels:
  - label: "1H resistance"
    price: 4400.0
    timeframe: 1h
    direction: both

  - label: "Daily support"
    price: 4250.0
    timeframe: 1d
    direction: below

  - label: "4H swing high"
    price: 4420.0
    timeframe: 4h
    direction: above
